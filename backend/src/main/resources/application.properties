spring.application.name=smart-appointment-avl

# H2 file database keeps appointments between application restarts.
spring.datasource.url=jdbc:h2:file:./data/smart_appointments;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.port=8080

# Demo data is inserted only when the database is empty.
app.seed-demo-data=true
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
